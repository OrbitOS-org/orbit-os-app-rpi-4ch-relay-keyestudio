<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="6" y="8" width="52" height="48" rx="10" fill="#0a0a0a" filter="url(#shadow)"/>
  <rect x="10" y="12" width="44" height="4" rx="2" fill="#FEDC19"/>
  <rect x="10" y="20" width="20" height="14" rx="3" fill="#2278CC"/>
  <rect x="34" y="20" width="20" height="14" rx="3" fill="#2278CC"/>
  <rect x="10" y="38" width="20" height="14" rx="3" fill="#2278CC"/>
  <rect x="34" y="38" width="20" height="14" rx="3" fill="#2278CC"/>
  <rect x="10" y="55" width="44" height="3" rx="1.5" fill="#374151"/>
  <circle cx="10" cy="10" r="4.5" fill="#e53935"/>
  <circle cx="10" cy="10" r="2.5" fill="#ff6b6b"/>
</svg>
